<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<title>BlanketJS</title>
	<meta name='description' content='A port of Blanket by rafaelmardojai for the browser using plain JavaScript'>
	<meta name='author' content='WarzeDev'>
	<meta name='keywords' content='blanket, blanketjs, sounds, ambient, music, sound, noise, generator, browser, javascript, web, app, application, rafaelmardojai, warzedev'>
	<meta name='robots' content='index, follow'>
	<meta name='revisit-after' content='1 days'>
	<meta name='language' content='English'>
	<meta name='theme-color' content='#3584E3'>
	<meta property='og:type' content='website'>
	<meta property='og:site_name' content='BlanketJS'>
	<meta property='og:title' content='BlanketJS'>
	<meta property='og:description' content='A port of Blanket by rafaelmardojai for the browser using plain JavaScript'>
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:site" content="@warzedev">
	<meta name="twitter:creator" content="@warzedev">
	<meta name="twitter:title" content="BlanketJS">
	<meta name="twitter:description" content="A port of Blanket by rafaelmardojai for the browser using plain JavaScript">

	<!-- Installation (PWA) -->
	<meta name='application-name' content='BlanketJS'>
	<meta name='mobile-web-app-capable' content='yes'>
	<meta name='apple-mobile-web-app-capable' content='yes'>
	<meta name='apple-mobile-web-app-title' content='BlanketJS'>
	<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>

	<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>

	<link rel='stylesheet' type='text/css' media='screen' href='css/base.css'>
	<link rel='stylesheet' type='text/css' media='screen' href='css/theme.css'>
	<link rel='stylesheet' type='text/css' media='screen' href='css/sound.css'>
	<link rel='stylesheet' type='text/css' media='screen' href='css/controlpanel.css'>
	<link rel='stylesheet' type='text/css' media='screen' href='css/dialog.css'>

	<script src='js/Sound.js'></script>
	
	<link rel="icon" type="x-icon" href="assets/logo/favicon.ico">
	<link rel="apple-touch-icon" href="assets/logo/icon-192.png">
	<link rel="manifest" href="assets/manifest.webmanifest">
</head>
<body>
	<main id="soundList"></main>
	<footer id="controlPanel">
		<div id="theme">
			<button id="themeToggle" class="sidebutton" type="button" aria-label="Choose theme" aria-haspopup="true" aria-expanded="false">
				<img src="assets/icons/sun.svg" alt="">
			</button>
			<div id="themeList" class="hidden"></div>
		</div>
		<button id="playback" class="active" type="button" aria-label="Play or pause all sounds">
			<svg id="play" width="24" height="24" viewBox="0 0 24 24">
				<path d="M8 5v14l11-7z" fill="currentColor"></path>
			</svg>
			<svg id="pause" width="24" height="24" viewBox="0 0 24 24">
				<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"></path>
			</svg>
		</button>
		<a id="source" class="sidebutton" href="https://github.com/WarzeDev/blanketJS" target="_blank" rel="noopener" aria-label="Source code on GitHub">
			<img src="assets/icons/github.svg" alt="">
		</a>
	</footer>

	<dialog id="addSoundDialog" aria-labelledby="addSoundTitle">
		<form id="addSoundForm" novalidate>
			<h2 id="addSoundTitle">Add a sound</h2>
			<label class="field">
				<span>Audio file</span>
				<input type="file" id="addSoundFile" accept="audio/*" required>
			</label>
			<label class="field">
				<span>Name</span>
				<input type="text" id="addSoundName" maxlength="24" placeholder="Ocean cave" autocomplete="off" required>
			</label>
			<p id="addSoundError" class="error" role="alert"></p>
			<div class="actions">
				<button type="button" id="addSoundCancel" class="secondary">Cancel</button>
				<button type="submit" id="addSoundSubmit">Add sound</button>
			</div>
		</form>
	</dialog>

	<script src='js/theme.js'></script>
	<script src='js/CustomSounds.js'></script>
	<script src='js/main.js'></script>
	<script src='js/addsound.js'></script>
</body>
</html>
